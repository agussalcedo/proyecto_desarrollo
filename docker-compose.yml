services:
  traefik:
    image: traefik:v2.11
    container_name: traefik_gateway
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://host.docker.internal:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=DEBUG"
    ports:
      - "80:80"
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - red_app

  api:
    build: .
    container_name: orchestrator_service
    restart: always
    environment:
      - MONGO_URL=mongodb://admin:password123@mongo:27017
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mi_api.rule=PathPrefix(`/`)"
      - "traefik.http.routers.mi_api.entrypoints=web"
      - "traefik.http.services.mi_api.loadbalancer.server.port=8000"
      - "traefik.docker.network=red_app"
    depends_on:
      - mongo
    networks:
      - red_app

  mongo:
    image: mongo:latest
    container_name: proyecto_desarrollo_db
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password123
    volumes:
      - mongo_data:/data/db
    networks:
      - red_app

networks:
  red_app:
    name: red_app
    driver: bridge

volumes:
  mongo_data: