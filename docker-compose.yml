services:
  traefik:
    image: traefik:v2.11
    container_name: traefik_gateway
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=DEBUG"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      # Forma estandar de que Traefik "vea" los contenedores de Docker,
      # sin necesitar habilitar el puerto TCP inseguro del daemon
      # (que no todos tienen activado en Docker Desktop).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - red_app

  # ---------------------------------------------------------------
  # Microservicio de documentos: extracción de PDF y persistencia
  # en MongoDB. Responde en /documents, /health, /docs y /.
  # ---------------------------------------------------------------
  document_service:
    build: ./microservices/document_service
    container_name: document_service
    restart: always
    environment:
      - MONGO_URL=mongodb://admin:password123@mongo:27017
      - MONGO_DB_NAME=proyecto_desarrollo
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.document_api.rule=PathPrefix(`/`)"
      - "traefik.http.routers.document_api.priority=1"
      - "traefik.http.routers.document_api.entrypoints=web"
      - "traefik.http.services.document_api.loadbalancer.server.port=8000"
      - "traefik.docker.network=red_app"
      # Rate limiting ("el patovica"): permite en promedio 10 pedidos/seg
      # por IP, con un margen (burst) de hasta 20 antes de empezar a
      # rechazar con 429 Too Many Requests. Se define una sola vez y lo
      # usan los routers de ambos microservicios.
      - "traefik.http.middlewares.mi_ratelimit.ratelimit.average=10"
      - "traefik.http.middlewares.mi_ratelimit.ratelimit.burst=20"
      - "traefik.http.routers.document_api.middlewares=mi_ratelimit"
    # Liveness: la imagen python-slim no trae curl, así que se usa Python.
    # Falla (exit 1) si /health/live no responde 2xx.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - red_app

  # ---------------------------------------------------------------
  # Microservicio orquestador: coordina llamadas al document_service.
  # Responde en /orchestrator (docs en /orchestrator/docs).
  # ---------------------------------------------------------------
  orchestrator_service:
    build: ./microservices/orchestrator_service
    container_name: orchestrator_service
    restart: always
    environment:
      - DOCUMENT_SERVICE_URL=http://document_service:8000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orchestrator_api.rule=PathPrefix(`/orchestrator`)"
      - "traefik.http.routers.orchestrator_api.priority=10"
      - "traefik.http.routers.orchestrator_api.entrypoints=web"
      - "traefik.http.services.orchestrator_api.loadbalancer.server.port=8000"
      - "traefik.docker.network=red_app"
      - "traefik.http.routers.orchestrator_api.middlewares=mi_ratelimit@docker"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/orchestrator/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      document_service:
        condition: service_healthy
    networks:
      - red_app

  mongo:
    image: mongo:latest
    container_name: proyecto_desarrollo_db
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password123
    volumes:
      - mongo_data:/data/db
    # "ping" no requiere autenticación, por eso no hacen falta credenciales acá.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - red_app

networks:
  red_app:
    name: red_app
    driver: bridge

volumes:
  mongo_data:
